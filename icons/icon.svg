<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </radialGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>
  
  <!-- Background Circle -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)"/>
  <circle cx="256" cy="256" r="230" fill="none" stroke="#334155" stroke-width="4"/>
  <circle cx="256" cy="256" r="210" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-dasharray="8 8"/>
  
  <!-- Card Back Left -->
  <g transform="translate(150, 160) rotate(-18) scale(0.95)" filter="url(#dropShadow)">
    <rect width="140" height="200" rx="12" fill="#1e1b4b" stroke="#4338ca" stroke-width="4"/>
    <rect x="10" y="10" width="120" height="180" rx="8" fill="none" stroke="#6366f1" stroke-width="2" stroke-dasharray="4 4"/>
    <circle cx="70" cy="100" r="24" fill="#4338ca"/>
    <text x="70" y="108" font-family="sans-serif" font-size="28" font-weight="bold" fill="#a5b4fc" text-anchor="middle">♠</text>
  </g>
  
  <!-- Card Back Right -->
  <g transform="translate(220, 150) rotate(18) scale(0.95)" filter="url(#dropShadow)">
    <rect width="140" height="200" rx="12" fill="#4c0519" stroke="#be123c" stroke-width="4"/>
    <rect x="10" y="10" width="120" height="180" rx="8" fill="none" stroke="#f43f5e" stroke-width="2" stroke-dasharray="4 4"/>
    <circle cx="70" cy="100" r="24" fill="#be123c"/>
    <text x="70" y="108" font-family="sans-serif" font-size="28" font-weight="bold" fill="#fecdd3" text-anchor="middle">♥</text>
  </g>
  
  <!-- Main Ace Card Center -->
  <g transform="translate(186, 170)" filter="url(#dropShadow)">
    <rect width="140" height="200" rx="12" fill="url(#cardGrad)" stroke="#cbd5e1" stroke-width="2"/>
    <text x="18" y="32" font-family="sans-serif" font-size="24" font-weight="900" fill="#dc2626">A</text>
    <text x="18" y="52" font-family="sans-serif" font-size="18" fill="#dc2626">♥</text>
    <text x="70" y="125" font-family="sans-serif" font-size="64" fill="#dc2626" text-anchor="middle">♥</text>
  </g>
  
  <!-- Crown Icon on top of cards -->
  <g transform="translate(186, 90)" filter="url(#dropShadow)">
    <path d="M 10,70 L 30,20 L 70,50 L 110,20 L 130,70 Z" fill="url(#goldGrad)" stroke="#78350f" stroke-width="3"/>
    <circle cx="10" cy="65" r="8" fill="#ef4444"/>
    <circle cx="30" cy="15" r="8" fill="#3b82f6"/>
    <circle cx="70" cy="45" r="9" fill="#10b981"/>
    <circle cx="110" cy="15" r="8" fill="#3b82f6"/>
    <circle cx="130" cy="65" r="8" fill="#ef4444"/>
    <rect x="15" y="70" width="110" height="12" rx="4" fill="#d97706" stroke="#78350f" stroke-width="2"/>
  </g>
</svg>
